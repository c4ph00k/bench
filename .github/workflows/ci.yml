# Runs the same commands as local development: npm run check, then npm run e2e.
# Branch protection on main requires the job named "check" - renaming it breaks the match.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # npm run check shells out to the gitleaks binary, so put the release on PATH.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
        env:
          GITLEAKS_VERSION: 8.30.1

      - run: npm run check

      - run: npx playwright install --with-deps chromium

      - run: npm run e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
